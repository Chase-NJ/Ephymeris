[project]
name = "ephymeris-sidecar"
version = "0.1.0"
description = "Ephymeris backend sidecar — owns serial I/O, arduino-cli, storage, and analytics"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "websockets>=14",
    # The arduino-cli gRPC daemon client (hardware-interaction.md §2). A
    # deliberate exception to the two-dependency rule — see reference.md's
    # dependency policy: the subprocess backend remains as a fallback, so a
    # failed grpcio install degrades flashing to the old path, never breaks it.
    "grpcio>=1.60",
    "protobuf>=5",
    # Validation for the two operator-authored documents: the rig wiring
    # (hardware/store.py) and a task profile. A SECOND exception to the
    # two-dependency rule, and a weaker one than grpcio's — grpcio has the
    # subprocess backend behind it, so a failed wheel degrades flashing rather
    # than removing it, and there is no second validator to fall back to. So the
    # fence is around SCOPE instead: every import of it is inside the function
    # that needs it, a failure disables the wiring and profile editors, and
    # flashing, the session flow and everything already saved keep working.
    # jsonschema drags the native rpds-py, which is the part that can actually
    # fail to install; a packaged build resolves it once and freezes the result,
    # so lab machines never run pip for it.
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # Codegen for the vendored arduino-cli protos (scripts/gen_grpc.py).
    # Build-time only: the generated stubs are committed, like the wire mirrors.
    "grpcio-tools>=1.60",
]
# Only needed to build a shipped installer, so it doesn't ride along with dev.
package = [
    "pyinstaller>=6",
]

[project.scripts]
ephymeris-sidecar = "ephymeris_sidecar.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ephymeris_sidecar*"]

# The registries. `rig/paths.py` resolves both directories package-relative and
# treats them as present in every install, so a wheel that dropped them would
# import cleanly and then be unable to name a single pin or strobe.
[tool.setuptools.package-data]
"ephymeris_sidecar.rig" = ["schema/*.json", "hardware/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
