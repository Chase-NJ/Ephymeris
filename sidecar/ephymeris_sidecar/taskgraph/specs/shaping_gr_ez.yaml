# shaping_GR_EZ — the eased variant of shaping_gr. Same paradigm, longer runway.
#
# THIS FILE EXISTS TO BE DIFFED. Run:
#
#     diff specs/shaping_gr.yaml specs/shaping_gr_ez.yaml
#
# Every changed line is inside `timing:` or `policy.stage_schedule:` (plus spec_id
# and meta). Nothing in `topology:` or `contingency:` moves. That is the layer-3
# claim from the roadmap, made checkable rather than asserted.
#
# It mirrors the firmware exactly: shaping_GR.ino and shaping_GR_EZ.ino differ by
# one function call — applyShapingDefaults() vs applyEasedShapingDefaults()
# (BehaviorBox.h:588-622) — and that function changes only lazyRatDelay,
# noPokeHoldTimeout and the five stage rows.

spec_version: 1
spec_id: shaping_gr_ez
vocab_version: 1

meta:
  label: Shaping — go right (odor 1), eased
  description: >-
    The same schedule stretched out and started softer, for an animal struggling
    with the standard shaping ramp. Same shape, more trials per step, and a longer
    runway before the holds bite.
  reproduces_sketch: "Olfactory Behavior/01_Shaping/shaping_GR_EZ/shaping_GR_EZ.ino"
  derived_from: shaping_gr

topology:
  template: four_epoch
  template_version: 2
  n_sampling_stages: 1
  retention_delay: false
  response_mode: n_alternative
  response_ports: [left_well, right_well]
  commit_hold: true

# ---------------------------------------------------------------------------
# LAYER 3 — applyEasedShapingDefaults() (BehaviorBox.h:610-622).
# THE ONLY SUBSTANTIVE DIFFERENCE FROM shaping_gr: three values here, five rows below.
# ---------------------------------------------------------------------------
timing:
  - {id: t_zero,          ms: 0,     note: "Required by every spec — carries paired strobes and the response branch."}
  - {id: t_arm,           ms: 1000,  wire_key: PRD, note: primingDelay}
  - {id: t_engage_win,    ms: 12000, wire_key: S0O, note: "odorPortTimeout, stage[0] — eased: 8000 -> 12000"}
  - {id: t_commit_hold,   ms: 10,    wire_key: S0P, note: "odorPokeHold at BehaviorBox.h:1176"}
  - {id: t_sample_hold,   ms: 10,    wire_key: S0P, note: "odorPokeHold at BehaviorBox.h:1191 — distinct index, same wire key"}
  - {id: t_resp_win,      ms: 15000, wire_key: S0W, note: "fluidWellPoll — eased: 10000 -> 15000"}
  - {id: t_resp_hold,     ms: 10,    wire_key: S0H, note: fluidWellHold}
  - {id: t_reward_l,      ms: 100,   wire_key: FP0}
  - {id: t_reward_r,      ms: 100,   wire_key: FP2}
  - {id: t_iti_correct,   ms: 4000,  wire_key: ITI, note: standardITI}
  - {id: t_pen_error,     ms: 20000, wire_key: ERR, note: errorDelay}
  - {id: t_pen_break,     ms: 3000,  wire_key: NPH, note: "noPokeHoldTimeout — eased: 5000 -> 3000"}
  - {id: t_pen_noengage,  ms: 3000,  wire_key: LZD, note: "lazyRatDelay — eased: 4000 -> 3000. A SHORTER penalty: re-engaging is what we want."}
  - {id: t_poll_interval, ms: 2,     wire_key: POL, note: pollingRate}

# ---------------------------------------------------------------------------
# LAYER 2 — byte-identical to shaping_gr.yaml. Do not edit one without the other.
# ---------------------------------------------------------------------------
contingency:
  stimuli:
    - {id: odor1, emitter: odor_line_1, on_code: ODOR_1_ON, note: sandalwood}
    - {id: odor2, emitter: odor_line_2, on_code: ODOR_2_ON}
    - {id: odor3, emitter: odor_line_3, on_code: ODOR_3_ON, note: orange}
    - {id: odor4, emitter: odor_line_4, on_code: ODOR_4_ON}

  ports:
    left_well:
      channel: left_well
      enter_code: WATER_POKE_L
      error_code: WATER_POKE_ERROR_L
      break_code: WATER_UNPOKE_EARLY_L
      exit_code: WATER_UNPOKE_L
      reward_line: fluid_0
      reward_duration: t_reward_l
      reward_code: FLUID_L
      reward_stop_code: STOP_FLUID_G_L
    right_well:
      channel: right_well
      enter_code: WATER_POKE_R
      error_code: WATER_POKE_ERROR_R
      break_code: WATER_UNPOKE_EARLY_R
      exit_code: WATER_UNPOKE_R
      reward_line: fluid_2
      reward_duration: t_reward_r
      reward_code: FLUID_R
      reward_stop_code: STOP_FLUID_G_R

  trial_types:
    - {id: go_right_1, stages: [odor1], target: right_well, weight: 1}
    - {id: go_right_2, stages: [odor2], target: right_well, weight: 0}
    - {id: go_left_1,  stages: [odor3], target: left_well,  weight: 0}
    - {id: go_left_2,  stages: [odor4], target: left_well,  weight: 0}

  context_schedule: []

  outcome_map:
    correct:
      trigger: HELD
      reward: "@target"
      terminal: TRIAL_CORRECT
      delay: t_iti_correct
      strobe: "@target.exit_code"
    wrong:
      trigger: ENTER
      reward: null
      terminal: TRIAL_INCORRECT
      delay: t_pen_error
      strobe: "@ports[$ch].error_code"
    omission:
      trigger: TIMEOUT
      reward: null
      terminal: TRIAL_INCORRECT
      delay: t_pen_error
      strobe: RESP_OMIT
      note: >-
        Firmware conforms to the model now (D21), so an omission announces itself
        instead of being inferable only from a gap before END_INCORRECT_ITI.
    hold_fail:
      trigger: BROKEN
      reward: null
      terminal: TRIAL_INCORRECT
      delay: t_pen_break
      strobe: "@ports[$ch].break_code"
    no_engage:
      trigger: TIMEOUT
      reward: null
      terminal: TRIAL_INVALID
      delay: t_pen_noengage
      strobe: LAZY_RAT
    hold_break:
      trigger: BROKEN
      reward: null
      terminal: TRIAL_INVALID
      delay: t_pen_break
      strobe: ODOR_UNPOKE_EARLY

policy:
  selection:
    mode: block_shuffled
    block_size: 30

  # The eased ramp: same five rows, later thresholds, softer early values.
  stage_schedule:
    - at_trial: 0
      set: {t_commit_hold: 10,  t_sample_hold: 10,  t_resp_hold: 10,  t_resp_win: 15000, t_engage_win: 12000}
    - at_trial: 40
      set: {t_commit_hold: 50,  t_sample_hold: 50,  t_resp_hold: 25,  t_resp_win: 12000, t_engage_win: 10000}
    - at_trial: 80
      set: {t_commit_hold: 125, t_sample_hold: 125, t_resp_hold: 100, t_resp_win: 8000,  t_engage_win: 8000}
    - at_trial: 140
      set: {t_commit_hold: 250, t_sample_hold: 250, t_resp_hold: 250, t_resp_win: 5000,  t_engage_win: 6000}
    - at_trial: 220
      set: {t_commit_hold: 500, t_sample_hold: 500, t_resp_hold: 500, t_resp_win: 2000,  t_engage_win: 4000}

  n_trials: 1000
  seed: host
