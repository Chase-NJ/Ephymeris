# Go / no-go -- the inversion, and in the model it really is one edge.
paradigm_version: 1
id: go_nogo
name: Go / no-go
order: 40
affords: >-
  One stimulus, and success is withholding. The response window expiring IS the
  correct outcome, and any port entry is a false alarm. Measures impulse control
  rather than discrimination between ports, so there is no correct side and the
  trial types declare no target at all.

template: four_epoch
template_version: 2

topology:
  n_sampling_stages: 1
  retention_delay: false
  response_mode: go_nogo
  commit_hold: true
  # Both wells stay live: a false alarm is an entry at EITHER, and watching only
  # one would score half of them as correct withholding.
  response_ports: 2

contingency:
  stimuli: 1
  rewarded: false
  trial_types: single_withhold

policy:
  selection:
    mode: weighted_pool
  n_trials: 200

questions:
  - id: stim_emitter
    label: Stimulus line
    path: contingency.stimuli[0].emitter
    source: channel
    kind: emitter
    required: true
  - id: n_trials
    label: Trials per session
    path: policy.n_trials
