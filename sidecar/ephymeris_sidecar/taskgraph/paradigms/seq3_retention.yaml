paradigm_version: 1
id: seq3_retention
name: Three-stimulus sequence
order: 60
affords: >-
  A third element in the chain, so the sequence is longer than working memory
  comfortably holds. Adds a hold and a gap to the sampling epoch; everything else
  is the two-stimulus task, which is what makes the comparison between them a
  clean one.

template: four_epoch
template_version: 2

topology:
  n_sampling_stages: 3
  retention_delay: true
  response_mode: n_alternative
  commit_hold: true
  response_ports: 2

contingency:
  stimuli: 3
  rewarded: true
  trial_types: one_per_stimulus

policy:
  selection:
    mode: weighted_pool
  n_trials: 400
