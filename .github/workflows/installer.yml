# Builds the Windows installer on a clean machine and hands it on as the `installer`
# artifact, and the Apple silicon .dmg as `installer-mac`. Called, never run on its own: release.yml builds a tagged version with it,
# ship-main.yml a build of main.
#
# Ephymeris-<v>-setup.exe, its .blockmap, and latest.yml, the feed entry naming the
# installer and its sha512 (ADR 0006, docs/ARCHITECTURE.md#updates).
#
# Ephymeris-<v>-arm64.dmg is for reading data away from the rigs: ad-hoc signed, outside the
# update feed (docs/DEVELOPING.md#building-the-installer).
#
# One copy of these steps, so a tagged release and a main build can't drift apart in what
# they bundle.

name: Installer

on:
  workflow_call:
    inputs:
      version:
        description: "Overrides package.json's version; empty builds the version as committed"
        type: string
        default: ""

# Narrower than the callers' contents: write, which a called workflow would
# otherwise inherit: this job needs only a checkout.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Pinned: this copy ships inside the installer, and the action's default
      # picks up release candidates. Move it on purpose, after a lab compile.
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"

      # package-resources.mjs freezes from exactly sidecar/.venv.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          python -m venv sidecar\.venv
          sidecar\.venv\Scripts\pip.exe install -e "sidecar[dev]"

      - run: npm ci

      # The app reports package.json's version (app.getVersion()) and the updater compares
      # against it, so an override merged in at build time is the whole of a version bump.
      - name: Version override
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: echo "VERSION_CONFIG=-c.extraMetadata.version=$VERSION" >> "$GITHUB_ENV"

      # Stages the sidecar, arduino-cli and sketches, builds dist/ and dist-electron/, then
      # the installer; its feed entry (latest.yml) is written beside it. The frozen sidecar
      # is started and made to write a .mat on the way, here and in the mac job
      # (docs/DEVELOPING.md#building-the-installer); a sidecar that can't fails the build.
      - shell: bash
        run: npm run package:electron -- $VERSION_CONFIG

      # The installer's name carries the version it was built as. Refuse one that doesn't
      # carry the version asked for, rather than ship it under the wrong one.
      - name: Installer carries the version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ls release/
          ls "release/Ephymeris-${VERSION}-setup.exe"
          grep -qx "version: ${VERSION}" release/latest.yml

      # One flat folder, so the release jobs attach `installer/*`.
      - shell: bash
        run: |
          mkdir out
          cp release/*-setup.exe release/*-setup.exe.blockmap release/latest.yml out/

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # The lab runs on the Windows installer, so a failed Mac build never holds a release
  # back: the release then simply carries no .dmg.
  mac:
    runs-on: macos-15 # Apple silicon; everything bundled is the runner's own architecture
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          python -m venv sidecar/.venv
          sidecar/.venv/bin/pip install -e "sidecar[dev]"

      - run: npm ci

      - name: Version override
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: echo "VERSION_CONFIG=-c.extraMetadata.version=$VERSION" >> "$GITHUB_ENV"

      - run: npm run package:electron -- $VERSION_CONFIG

      - name: The .dmg carries the version and a valid signature
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ls release/
          if [ -n "$VERSION" ]; then ls "release/Ephymeris-${VERSION}-arm64.dmg"; fi
          codesign --verify --deep --strict release/mac-arm64/Ephymeris.app

      # The .dmg alone: latest-mac.yml stays behind, since no Mac copy reads a feed.
      - uses: actions/upload-artifact@v7
        with:
          name: installer-mac
          path: release/*-arm64.dmg
          if-no-files-found: error
          retention-days: 7
