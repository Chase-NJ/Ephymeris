# Two stimuli in order, with a gap between them and a delay before answering.
paradigm_version: 1
id: seq2_retention
name: Sequence with retention
order: 50
affords: >-
  Two stimuli presented in order with an unfilled gap between them, then a delay
  before the response window opens. Order is the discriminandum -- A then B goes
  one way, B then A the other -- and the delay is the working-memory load, so
  lengthening it is the manipulation rather than a timing tweak.

template: four_epoch
template_version: 2

topology:
  n_sampling_stages: 2
  retention_delay: true
  response_mode: n_alternative
  commit_hold: true
  response_ports: 2

contingency:
  stimuli: 2
  rewarded: true
  trial_types: sequence_pairs

policy:
  selection:
    mode: anti_bias
    bias_window: 20
    debias_strength: 0.5
    p_min: 0.02
    p_max: 0.98
    max_run: 10
  n_trials: 400
  ramped:
    - t_retention

questions:
  - id: stim_a_emitter
    label: First stimulus line
    path: contingency.stimuli[0].emitter
    source: channel
    kind: emitter
    required: true
  - id: stim_b_emitter
    label: Second stimulus line
    path: contingency.stimuli[1].emitter
    source: channel
    kind: emitter
    required: true
