# Go/no-go — a withhold window where SUCCESS IS DEFINED BY INACTION.
#
# NOVEL. No shipped sketch instantiates this, so there is no bit-identity target
# (meta.reproduces_sketch is absent) and this spec is the only thing validating the
# design. It is a forcing function: if a schema decision makes this awkward, that
# decision is wrong.
#
# THE POINT OF THIS FILE — "correct = timeout" with no special case:
#
#   The withhold window is an ordinary WAIT_ENTRY. Its TIMEOUT edge carries
#   `terminal: TRIAL_CORRECT`, and an ENTER edge carries TRIAL_INCORRECT. Nothing
#   about the node type, the trigger, or the interpreter changes — scoring is an
#   EDGE EFFECT, so inverting the meaning of TIMEOUT is a table edit. The
#   interpreter never reads topology.response_mode. See docs/decisions.md D9.
#
#   The response hold, reward and consumption states drop out of the spine by
#   ABSENCE, not suppression: `reward: null` on every outcome means no PULSE and no
#   consumption WAIT_EXIT is emitted. There is no "disable reward" flag.
#
# Useful accident: firmware already implements a working no-go branch
# (TrialType.isGo at BehaviorBox.h:171, the else at :1115-1133, nogoWellPoll, and
# BF_WATER_POKE_NONE returning OUTCOME_CORRECT on window expiry at :1132). So this
# task needs NO new strobe codes — WATER_POKE_NONE already exists and means exactly
# this. If a no-go sketch is ever built, it becomes a fifth equivalence target
# almost for free.

spec_version: 1
spec_id: gonogo
vocab_version: 1

meta:
  label: Go/no-go withhold
  description: >-
    Odor 1 is a no-go: the subject must withhold from both wells for the whole
    window. Window expiry is the correct outcome; any port entry is a false alarm
    routing to the error branch.

topology:
  template: four_epoch
  template_version: 2
  n_sampling_stages: 1
  retention_delay: false
  response_mode: go_nogo
  response_ports: [left_well, right_well]   # both live — ANY entry is a false alarm
  commit_hold: true

timing:
  - {id: t_zero,           ms: 0}
  - {id: t_arm,            ms: 1000}
  - {id: t_engage_win,     ms: 4000}
  - {id: t_commit_hold,    ms: 500}
  - {id: t_sample_hold,    ms: 500}
  - {id: t_withhold_win,   ms: 2000, wire_key: NWP, note: "nogoWellPoll — the window that must be survived, not acted in"}
  - {id: t_iti_correct,    ms: 4000}
  - {id: t_pen_error,      ms: 20000}
  - {id: t_pen_break,      ms: 10000}
  - {id: t_pen_noengage,   ms: 6000}
  - {id: t_poll_interval,  ms: 5}
  # NOTE what is absent: no t_resp_hold and no t_reward_*. A withhold task has no
  # port to hold and no line to open, so those timing entries do not exist rather
  # than existing and being ignored. The compiler emits a shorter timing vector.

contingency:
  stimuli:
    - {id: odor1, emitter: odor_line_1, on_code: ODOR_1_ON, note: "the no-go cue"}

  ports:
    left_well:
      channel: left_well
      enter_code: WATER_POKE_L      # doubles as the false-alarm code
    right_well:
      channel: right_well
      enter_code: WATER_POKE_R
    # No reward_line, reward_duration, reward_code or break_code: a withhold trial
    # never rewards and never holds, so those bindings are absent. The template
    # emits no reward or consumption node for a port with no reward_line.

  trial_types:
    - id: nogo_odor1
      stages: [odor1]
      target: null
      note: >-
        target: null IS the withhold declaration. There is no correct port, so the
        `port == @target` guard that routes a choice on an n-alternative task can
        never be satisfied, and every ENTER falls to the false-alarm branch.

  context_schedule: []

  outcome_map:
    # ---- THE INVERSION, and it is one line ----
    correct:
      trigger: TIMEOUT              # <- on an n-alternative task this same trigger is `omission`
      reward: null
      terminal: TRIAL_CORRECT
      delay: t_iti_correct
      strobe: WATER_POKE_NONE
      note: >-
        The subject withheld for the whole window. Scored correct, counter advances,
        penalty escalation clears. Firmware already agrees: BehaviorBox.h:1132 emits
        BF_WATER_POKE_NONE and returns OUTCOME_CORRECT when nogoWellPoll expires.

    false_alarm:
      trigger: ENTER
      reward: null
      terminal: TRIAL_INCORRECT
      delay: t_pen_error
      strobe: "@ports[$ch].enter_code"
      note: >-
        A genuine commission error: full stimulus sampling occurred, so the trial is
        scored incorrect and counted — not invalid. Reuses the ordinary per-channel
        enter_code, because the physical event is the same one WATER_POKE_L/R always
        reports; what differs is which edge it takes.

    # Engagement-epoch outcomes are unchanged — the inversion is confined to the
    # response epoch, which is what "epochs are composable blocks" is supposed to buy.
    no_engage:
      trigger: TIMEOUT
      reward: null
      terminal: TRIAL_INVALID
      delay: t_pen_noengage
      strobe: LAZY_RAT
    hold_break:
      trigger: BROKEN
      reward: null
      terminal: TRIAL_INVALID
      delay: t_pen_break
      strobe: ODOR_UNPOKE_EARLY

    # DELIBERATELY ABSENT: `omission` (window expiry is the correct outcome, not an
    # omission), `wrong` (there is no wrong PORT, only a wrong ACT), and `hold_fail`
    # (no response hold exists to fail). The linter checks the declared class set
    # against what the template can emit for response_mode: go_nogo.

policy:
  selection:
    mode: weighted_pool
  stage_schedule: []
  n_trials: 500
  seed: host
