[project]
name = "ephymeris-sidecar"
version = "0.1.0"
description = "Ephymeris backend sidecar — owns serial I/O, arduino-cli, storage, and analytics"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "websockets>=14",
    # The arduino-cli gRPC daemon client (hardware-interaction.md §2). A
    # deliberate exception to the two-dependency rule — see reference.md's
    # dependency policy: the subprocess backend remains as a fallback, so a
    # failed grpcio install degrades flashing to the old path, never breaks it.
    "grpcio>=1.60",
    "protobuf>=5",
    # The vendored Task-Graph compiler (docs/specs.md). A SECOND exception to the
    # two-dependency rule, and an explicitly weaker one than grpcio's: grpcio has
    # the subprocess backend behind it, so a failed wheel degrades flashing rather
    # than removing it, and nothing can stand in for a compiler. So the fence is
    # around scope instead — ephymeris_sidecar/specs/compiler.py guards the import,
    # every specs.* handler reports SPEC_COMPILER_UNAVAILABLE if it failed, and the
    # legacy task.json path and the whole session flow are untouched either way.
    # jsonschema drags the native rpds-py, which is the part that can actually fail
    # to install; a packaged build resolves it once and freezes the result, so lab
    # machines never run pip for it.
    "jsonschema>=4.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # Codegen for the vendored arduino-cli protos (scripts/gen_grpc.py).
    # Build-time only: the generated stubs are committed, like the wire mirrors.
    "grpcio-tools>=1.60",
]
# Only needed to build a shipped installer, so it doesn't ride along with dev.
package = [
    "pyinstaller>=6",
]

[project.scripts]
ephymeris-sidecar = "ephymeris_sidecar.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ephymeris_sidecar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
