# shaping_GR — go-RIGHT shaping on odor 1 (sandalwood).
#
# Proves the timing-vector and stage-ramp layers carry real weight. This spec and
# shaping_gr_ez.yaml differ ONLY in layer 3; `diff` the two files and every changed
# line is inside `timing:` or `policy.stage_schedule:`. That is not an aspiration —
# it mirrors the firmware, where the two sketches differ by exactly one function
# call, applyShapingDefaults() vs applyEasedShapingDefaults().
#
# No policy objects: the shaping sketches pass nullptr for all three, which means
# flat penalties, no anti-bias, no correction budget (BehaviorBox.h:997-1015).

spec_version: 1
spec_id: shaping_gr
vocab_version: 1

meta:
  label: Shaping — go right (odor 1)
  description: >-
    Single-side shaping with a 5-row ramp from a 10 ms hold and a 10 s response
    window to the full task's 500/2000 ms. Block-shuffled selection from a 4-slot
    pool whose weights are operator-set.
  reproduces_sketch: "Olfactory Behavior/01_Shaping/shaping_GR/shaping_GR.ino"

topology:
  template: four_epoch
  template_version: 2
  n_sampling_stages: 1
  retention_delay: false
  response_mode: n_alternative
  response_ports: [left_well, right_well]
  commit_hold: true

# ---------------------------------------------------------------------------
# LAYER 3 — applyShapingDefaults() (BehaviorBox.h:588-604) with stage[0] live.
# ---------------------------------------------------------------------------
timing:
  - {id: t_zero,          ms: 0,     note: "Required by every spec — carries paired strobes and the response branch."}
  - {id: t_arm,           ms: 1000,  wire_key: PRD, note: primingDelay}
  - {id: t_engage_win,    ms: 8000,  wire_key: S0O, note: "odorPortTimeout, stage[0]"}
  - {id: t_commit_hold,   ms: 10,    wire_key: S0P, note: "odorPokeHold at BehaviorBox.h:1176"}
  - {id: t_sample_hold,   ms: 10,    wire_key: S0P, note: "odorPokeHold at BehaviorBox.h:1191 — distinct index, same wire key"}
  - {id: t_resp_win,      ms: 10000, wire_key: S0W, note: fluidWellPoll}
  - {id: t_resp_hold,     ms: 10,    wire_key: S0H, note: fluidWellHold}
  - {id: t_reward_l,      ms: 100,   wire_key: FP0}
  - {id: t_reward_r,      ms: 100,   wire_key: FP2}
  - {id: t_iti_correct,   ms: 4000,  wire_key: ITI, note: standardITI}
  - {id: t_pen_error,     ms: 20000, wire_key: ERR, note: errorDelay}
  - {id: t_pen_break,     ms: 5000,  wire_key: NPH, note: noPokeHoldTimeout}
  - {id: t_pen_noengage,  ms: 4000,  wire_key: LZD, note: "lazyRatDelay — FLAT, no escalation (nullptr policy)"}
  - {id: t_poll_interval, ms: 2,     wire_key: POL, note: pollingRate}

# ---------------------------------------------------------------------------
# LAYER 2 — identical to shaping_gr_ez.
# ---------------------------------------------------------------------------
contingency:
  stimuli:
    - {id: odor1, emitter: odor_line_1, on_code: ODOR_1_ON, note: sandalwood}
    - {id: odor2, emitter: odor_line_2, on_code: ODOR_2_ON}
    - {id: odor3, emitter: odor_line_3, on_code: ODOR_3_ON, note: orange}
    - {id: odor4, emitter: odor_line_4, on_code: ODOR_4_ON}

  ports:
    left_well:
      channel: left_well
      enter_code: WATER_POKE_L
      error_code: WATER_POKE_ERROR_L
      break_code: WATER_UNPOKE_EARLY_L
      exit_code: WATER_UNPOKE_L
      reward_line: fluid_0
      reward_duration: t_reward_l
      reward_code: FLUID_L
      reward_stop_code: STOP_FLUID_G_L
    right_well:
      channel: right_well
      enter_code: WATER_POKE_R
      error_code: WATER_POKE_ERROR_R
      break_code: WATER_UNPOKE_EARLY_R
      exit_code: WATER_UNPOKE_R
      reward_line: fluid_2
      reward_duration: t_reward_r
      reward_code: FLUID_R
      reward_stop_code: STOP_FLUID_G_R

  # ORDER IS THE CONTRACT: these four slots map to PW1..PW4 in order, and
  # task.json labels them accordingly (shaping_GR.ino:44-52). shaping_GR sets
  # PW1=1 and the rest 0, so only go_right_1 is actually presented.
  trial_types:
    - {id: go_right_1, stages: [odor1], target: right_well, weight: 1}
    - {id: go_right_2, stages: [odor2], target: right_well, weight: 0}
    - {id: go_left_1,  stages: [odor3], target: left_well,  weight: 0}
    - {id: go_left_2,  stages: [odor4], target: left_well,  weight: 0}

  context_schedule: []

  outcome_map:
    correct:
      trigger: HELD
      reward: "@target"
      terminal: TRIAL_CORRECT
      delay: t_iti_correct
      strobe: "@target.exit_code"
    wrong:
      trigger: ENTER
      reward: null
      terminal: TRIAL_INCORRECT
      delay: t_pen_error
      strobe: "@ports[$ch].error_code"
    omission:
      trigger: TIMEOUT
      reward: null
      terminal: TRIAL_INCORRECT
      delay: t_pen_error
      strobe: RESP_OMIT
      note: >-
        Firmware conforms to the model now (D21), so an omission announces itself
        instead of being inferable only from a gap before END_INCORRECT_ITI.
    hold_fail:
      trigger: BROKEN
      reward: null
      terminal: TRIAL_INCORRECT
      delay: t_pen_break
      strobe: "@ports[$ch].break_code"
    no_engage:
      trigger: TIMEOUT
      reward: null
      terminal: TRIAL_INVALID
      delay: t_pen_noengage
      strobe: LAZY_RAT
    hold_break:
      trigger: BROKEN
      reward: null
      terminal: TRIAL_INVALID
      delay: t_pen_break
      strobe: ODOR_UNPOKE_EARLY

# ---------------------------------------------------------------------------
# LAYER 4 — policy. No penalty_escalation and no correction block: their absence
# means legacy semantics, exactly as a nullptr does in firmware's TrialPolicy.
# ---------------------------------------------------------------------------
policy:
  selection:
    mode: block_shuffled
    block_size: 30
    # Exact proportional counts placed first, remainder filled by weighted draw,
    # then Fisher-Yates shuffled within the block (BehaviorBox.h:210-245).

  # The 5-row ramp, from applyShapingDefaults(). Rows are scanned descending
  # with >=, so applying twice or skipping a count lands on the same row.
  stage_schedule:
    - at_trial: 0
      set: {t_commit_hold: 10,  t_sample_hold: 10,  t_resp_hold: 10,  t_resp_win: 10000, t_engage_win: 8000}
    - at_trial: 20
      set: {t_commit_hold: 100, t_sample_hold: 100, t_resp_hold: 50,  t_resp_win: 10000, t_engage_win: 8000}
    - at_trial: 25
      set: {t_commit_hold: 125, t_sample_hold: 125, t_resp_hold: 250, t_resp_win: 5000,  t_engage_win: 8000}
    - at_trial: 50
      set: {t_commit_hold: 250, t_sample_hold: 250, t_resp_hold: 500, t_resp_win: 2000,  t_engage_win: 4000}
    - at_trial: 100
      set: {t_commit_hold: 500, t_sample_hold: 500, t_resp_hold: 500, t_resp_win: 2000,  t_engage_win: 4000}

  n_trials: 1000
  seed: host
