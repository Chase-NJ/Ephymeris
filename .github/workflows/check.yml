# Every push to main: run the same suites a maintainer runs by hand (README "Commands").
# Nothing here touches hardware; the tests that need arduino-cli, RHX or the lab's
# probe maps skip themselves when those are absent.

name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # checkout only; no job writes

# A newer push to the same branch makes an older run's answer irrelevant.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Protocol, typecheck, vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run check

  sidecar:
    name: Sidecar (${{ matrix.os }})
    # Windows is what the lab runs; Linux catches anything that only worked by
    # accident of Windows paths.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Windows takes about ten minutes; a hang should fail, not hold the PR for
    # GitHub's six-hour default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sidecar/pyproject.toml
      - run: pip install -e "sidecar[dev]"
      # One worker per hosted-runner vCPU; worksteal keeps the slow RHX and
      # utility tests from piling onto one worker. --durations shows what
      # Windows in particular is slow at.
      - run: python -m pytest -n 4 --dist worksteal --durations=25
        working-directory: sidecar

  firmware:
    name: Firmware host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh firmware/libraries/BehaviorBox/extras/host_test/run.sh
      - run: sh firmware/libraries/BehaviorBox/extras/host_test/run_box.sh

  # The host tests are the strict type check; this is the real AVR build. The
  # sketches only compile from a folder the app generated, so generate them the
  # way a startup does (taskdef/bundled.py) against the default rig, then build
  # each with --warnings all (firmware/README.md "Building and testing").
  firmware-compile:
    name: Firmware compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sidecar/pyproject.toml
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index && arduino-cli core install arduino:avr
      - run: pip install -e sidecar
      - name: Generate the bundled sketches
        run: python -c "import sys, pathlib; from ephymeris_sidecar.taskdef.bundled import repin_all; n = repin_all(pathlib.Path(sys.argv[1])); print(n, 'sketches'); sys.exit(n == 0)" "$RUNNER_TEMP/sketches"
      - name: Compile each for the Mega 2560
        shell: bash
        run: |
          shopt -s nullglob
          for sketch in "$RUNNER_TEMP"/sketches/*/*/; do
            echo "::group::$sketch"
            arduino-cli compile --fqbn arduino:avr:mega --warnings all \
              --libraries firmware/libraries "$sketch"
            echo "::endgroup::"
          done

  shell:
    name: Tauri shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Stable Rust ships with the runner image; installing it again is one more
      # download that can fail. Cargo.toml's rust-version is far behind it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The shell embeds ../dist at compile time, so the frontend must exist first.
      - run: npm ci
      - run: npm run build
      - run: cargo test
        working-directory: src-tauri
