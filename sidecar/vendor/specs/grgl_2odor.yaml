# GRGL 2-Odor — two-odor olfactory discrimination.
#
# THE equivalence target. This spec must eventually compile to a state table whose
# strobe stream is byte-identical to runTrial()'s for the same seed, parameters and
# scripted inputs. Every value below is traced to its firmware source; where the
# model and the firmware disagree, the firmware wins and the divergence is a comment.
#
# One sampling stage, two response alternatives, commitment hold on, no retention delay.

spec_version: 1
spec_id: grgl_2odor
vocab_version: 1

meta:
  label: GRGL 2-Odor discrimination
  description: >-
    Odor 1 (sandalwood) -> right well, odor 3 (orange) -> left well. Adaptive
    anti-bias selection, no correction budget, escalating abstention penalty.

topology:
  template: four_epoch
  template_version: 2
  n_sampling_stages: 1
  retention_delay: false
  response_mode: n_alternative
  response_ports: [left_well, right_well]
  commit_hold: true

# ---------------------------------------------------------------------------
# LAYER 3 — timing vector. Values are TaskParams' in-class defaults, which are
# the full-task (GRGL) values by construction: "The in-class defaults are the
# FULL-TASK (GRGL_2-Odor) values, so a bare START with no tokens still reproduces
# exactly the legacy behavior." (BehaviorBox.h:488-490)
# ---------------------------------------------------------------------------
timing:
  - id: t_zero
    ms: 0
    note: >-
      Required by every spec. Zero-duration nodes carry the second strobe of a
      paired emission and the response branch guard. See docs/decisions.md D2, D3.

  - id: t_arm
    ms: 1000
    wire_key: PRD
    note: primingDelay — odor primed before the trial light, so stimulus onset is latency-free.

  - id: t_engage_win
    ms: 4000
    wire_key: S0O
    note: odorPortTimeout, from stage[0] (BehaviorBox.h:532).

  - id: t_commit_hold
    ms: 500
    wire_key: S0P
    note: >-
      odorPokeHold at BehaviorBox.h:1176 — the pre-odor commitment hold.

  - id: t_sample_hold
    ms: 500
    wire_key: S0P
    note: >-
      odorPokeHold at BehaviorBox.h:1191 — the sampling hold. SAME wire key and
      SAME value as t_commit_hold, deliberately a DISTINCT index: firmware reads
      one field in two semantically different states, and splitting them here is
      what lets a future task separate the two without a firmware change.
      See docs/decisions.md D8.

  - id: t_resp_win
    ms: 2000
    wire_key: S0W
    note: fluidWellPoll — the response window.

  - id: t_resp_hold
    ms: 200
    wire_key: S0H
    note: fluidWellHold — hold at the chosen well before reward.

  - id: t_reward_l
    ms: 100
    wire_key: FP0
    note: fluidPinTimes[LEFT_WELL_FL_1] — pulse width IS the delivered volume.

  - id: t_reward_r
    ms: 100
    wire_key: FP2
    note: fluidPinTimes[RIGHT_WELL_FL_1].

  - id: t_iti_correct
    ms: 4000
    wire_key: ITI
    note: standardITI.

  - id: t_pen_error
    ms: 20000
    wire_key: ERR
    note: errorDelay — serves both wrong-port and omission (outcomeDelay, BehaviorBox.h:1038).

  - id: t_pen_break
    ms: 10000
    wire_key: NPH
    note: >-
      noPokeHoldTimeout — serves BOTH the sampling/commitment hold breaks
      (BehaviorBox.h:1184, :1200) and the response-hold failure (:1037).

  - id: t_pen_noengage
    ms: 6000
    wire_key: LZD
    note: lazyRatDelay — base value; policy.penalty_escalation grows it.

  - id: t_poll_interval
    ms: 5
    wire_key: POL
    note: pollingRate — input sampling granularity for every watched channel.

# ---------------------------------------------------------------------------
# LAYER 2 — contingency.
# ---------------------------------------------------------------------------
contingency:
  stimuli:
    - id: odor1
      emitter: odor_line_1          # Odors[0] = pin 22
      on_code: ODOR_1_ON
      note: sandalwood
    - id: odor3
      emitter: odor_line_3          # Odors[2] = pin 26
      on_code: ODOR_3_ON
      note: orange

  ports:
    left_well:
      channel: left_well            # pin 4
      enter_code: WATER_POKE_L
      error_code: WATER_POKE_ERROR_L
      break_code: WATER_UNPOKE_EARLY_L
      exit_code: WATER_UNPOKE_L
      reward_line: fluid_0          # Fluids[0] = pin 42
      reward_duration: t_reward_l
      reward_code: FLUID_L
      reward_stop_code: STOP_FLUID_G_L
    right_well:
      channel: right_well           # pin 3
      enter_code: WATER_POKE_R
      error_code: WATER_POKE_ERROR_R
      break_code: WATER_UNPOKE_EARLY_R
      exit_code: WATER_UNPOKE_R
      reward_line: fluid_2          # Fluids[2] = pin 46
      reward_duration: t_reward_r
      reward_code: FLUID_R
      reward_stop_code: STOP_FLUID_G_R

  # Mirrors the two const TrialType instances at GRGL_2-Odor.ino:43-59.
  trial_types:
    - id: go_right
      stages: [odor1]
      target: right_well
    - id: go_left
      stages: [odor3]
      target: left_well

  # Single block. A reversal would be one entry here and nothing else — no state,
  # edge or duration moves, which is why reversals are cheap in this model.
  context_schedule: []

  outcome_map:
    correct:
      trigger: HELD
      reward: "@target"
      terminal: TRIAL_CORRECT
      delay: t_iti_correct
      strobe: "@target.exit_code"
      note: >-
        WATER_UNPOKE_L/R is the ITI node's entry strobe — the only place firmware
        observes the end of a consummatory bout (BehaviorBox.h:1108-1113).

    wrong:
      trigger: ENTER
      reward: null
      terminal: TRIAL_INCORRECT
      delay: t_pen_error
      strobe: "@ports[$ch].error_code"
      note: >-
        Sampling completed and a choice was expressed, so this is a genuine
        discrimination error and advances the session. Firmware returns immediately
        without awaiting withdrawal, so there is NO exit strobe on this branch.

    omission:
      trigger: TIMEOUT
      reward: null
      terminal: TRIAL_INCORRECT
      delay: t_pen_error
      strobe: RESP_OMIT
      note: >-
        The response window expired after complete sampling. Current firmware
        emits NOTHING here, so an omission is inferable only from a 20-second gap
        before END_INCORRECT_ITI — and that terminal is reached by three different
        outcomes, making the class recoverable only from the preceding strobe.
        Firmware conforms to the model now (D21), so this emits RESP_OMIT (262) and
        all three become distinguishable where they occur. The as-built fixture in
        tests/fixtures/ keeps the silence for the historical corpus.
    hold_fail:
      trigger: BROKEN
      reward: null
      terminal: TRIAL_INCORRECT
      delay: t_pen_break
      strobe: "@ports[$ch].break_code"
      note: >-
        Correct port reached but released before the hold completed — a consummatory
        failure, not a wrong choice. Scored separately so it never contaminates the
        discrimination measure, but it still terminates at END_INCORRECT_ITI, so the
        outcome class is recoverable only from THIS strobe. Exactly why the
        one-state-one-strobe invariant matters.

    no_engage:
      trigger: TIMEOUT
      reward: null
      terminal: TRIAL_INVALID
      delay: t_pen_noengage
      strobe: LAZY_RAT
      note: >-
        No stimulus was presented, so the trial carries no evidence about
        discrimination: scored invalid and repeated, never counted as an error.

    hold_break:
      trigger: BROKEN
      reward: null
      terminal: TRIAL_INVALID
      delay: t_pen_break
      strobe: ODOR_UNPOKE_EARLY
      note: >-
        Sampling incomplete. Reached from two firmware sites — the pre-odor hold
        (:1176) and the sampling hold (:1191) — which share one code and are
        therefore indistinguishable downstream. Preserved as-is for bit-identity.

# ---------------------------------------------------------------------------
# LAYER 4 — policy. Values from TaskParams defaults + GRGL_2-Odor.ino:66-69.
# ---------------------------------------------------------------------------
policy:
  selection:
    mode: anti_bias           # live selection, NOT a pre-generated pool
    bias_window: 20
    debias_strength: 0.5
    p_min: 0.02
    p_max: 0.98
    max_run: 10

  correction:
    budgets:
      left_well: 0
      right_well: 0
    # 0/0 == never repeat == legacy bare-START behaviour.

  penalty_escalation:
    applies_to: no_engage
    step_ms: 6000             # lazyEscalateStep
    ceiling_ms: 30000         # lazyDelayMax
    arm_after_stage: 0        # lazyEscalationStage — armed from trial 0 on the full task
    clears_on: TRIAL_CORRECT
    # DECLARED, NOT IMPLIED. BehaviorBox.h:1171-1174: a bare odor-poke (or a
    # poke-and-bail) must not defuse the lazy penalty; only a completed CORRECT
    # trial clears it. That loophole was closed once and reopened once by a
    # copy-paste into the EZ sketch. Naming it here is how it stays closed.

  # GRGL does not ramp: stage rows 1..4 sit at the sentinel count no session
  # reaches (BehaviorBox.h:533-536). An unreachable row is expressed by OMISSION.
  stage_schedule: []

  n_trials: 1000
  seed: host
