# Builds the signed Windows installer on a clean machine and uploads it as the `installer`
# artifact (`*-setup.exe` and its `.sig`). Steps for a windows-latest job that has already
# checked the repository out; ship-release.yml and ship-update.yml both use it.
#
# One copy of these steps, so a release and an update can't drift apart in what they bundle.
# The calling job holds the signing key: give it `contents: read` and nothing more.

name: Build installer
description: Build and sign the Windows installer, and upload it as the `installer` artifact

inputs:
  version:
    description: "Overrides tauri.conf.json's version; empty builds the version as committed"
    default: ""
  signing-key:
    description: The TAURI_SIGNING_PRIVATE_KEY secret (an action cannot read secrets itself)
    required: true
  signing-key-password:
    description: The TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
    # Stable Rust ships with the runner image; installing it again is one more
    # download that can fail. Cargo.toml's rust-version is far behind it.
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
    # Pinned: this copy ships inside the installer, and the action's default
    # picks up release candidates. Move it on purpose, after a lab compile.
    - uses: arduino/setup-arduino-cli@v2
      with:
        version: "1.5.1"

    # package-resources.mjs freezes from exactly sidecar/.venv.
    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - shell: pwsh
      run: |
        python -m venv sidecar\.venv
        sidecar\.venv\Scripts\pip.exe install -e "sidecar[dev]"

    - shell: bash
      run: npm ci

    # The app reports tauri.conf.json's version (getVersion) and the updater compares
    # against it, so an override merged in at build time is the whole of a version bump.
    - name: Version override
      if: inputs.version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ version: process.env.VERSION }))' \
          "$RUNNER_TEMP/version.conf.json"
        echo "VERSION_CONFIG=--config $RUNNER_TEMP/version.conf.json" >> "$GITHUB_ENV"

    # tauri.updater.conf.json turns on the updater's signature, which needs the
    # private key; a local `npm run package` leaves it off and needs no key.
    - shell: bash
      run: npm run package -- --config src-tauri/tauri.updater.conf.json $VERSION_CONFIG
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signing-key }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signing-key-password }}

    # The installer's name carries the version it was built as. Refuse one that
    # doesn't carry the version asked for, rather than ship it under the wrong one.
    - name: Installer carries the version
      if: inputs.version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        ls src-tauri/target/release/bundle/nsis/
        ls "src-tauri/target/release/bundle/nsis/Ephymeris_${VERSION}_x64-setup.exe.sig"

    - uses: actions/upload-artifact@v7
      with:
        name: installer
        path: |
          src-tauri/target/release/bundle/nsis/*-setup.exe
          src-tauri/target/release/bundle/nsis/*-setup.exe.sig
        if-no-files-found: error
        retention-days: 7
