# The same machine with the fluid removed -- probe blocks and extinction.
paradigm_version: 1
id: two_afc_unrewarded
name: Two-alternative forced choice, unrewarded
order: 20
affords: >-
  The same discrimination with no fluid delivered: the choice is still recorded
  and scored, but nothing arrives. The reward delivery and consumption states are
  absent from the machine entirely, so this is genuinely a different graph rather
  than the same one with a zero volume.

template: four_epoch
template_version: 2

topology:
  n_sampling_stages: 1
  retention_delay: false
  response_mode: n_alternative
  commit_hold: true
  response_ports: 2

contingency:
  stimuli: 2
  rewarded: false
  trial_types: one_per_stimulus

policy:
  selection:
    mode: anti_bias
    bias_window: 20
    debias_strength: 0.5
    p_min: 0.02
    p_max: 0.98
    max_run: 10
  n_trials: 200

questions:
  - id: stim_a_emitter
    label: First stimulus line
    path: contingency.stimuli[0].emitter
    source: channel
    kind: emitter
    required: true
  - id: stim_b_emitter
    label: Second stimulus line
    path: contingency.stimuli[1].emitter
    source: channel
    kind: emitter
    required: true
