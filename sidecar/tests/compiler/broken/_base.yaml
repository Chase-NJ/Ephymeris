# A minimal VALID spec. Every fixture in this directory is this file plus one
# deliberate defect, so the defect is the only thing a reader has to look at.
#
# Keep it valid. A base that quietly develops its own errors would make every
# fixture pass for the wrong reason -- tests/test_broken_specs.py asserts the base
# compiles clean precisely to stop that.
#
# Kept deliberately smaller than specs/grgl_2odor.yaml: this exists to trip rules,
# not to model a real task.

spec_version: 1
spec_id: fixture_base
vocab_version: 1

meta:
  label: Fixture base
  description: Minimal valid spec used as the substrate for the broken-spec battery.

topology:
  template: four_epoch
  template_version: 1
  n_sampling_stages: 1
  retention_delay: false
  response_mode: n_alternative
  response_ports: [left_well, right_well]
  commit_hold: true
  cue_off_placement: after_sample_exit

timing:
  - {id: t_zero,          ms: 0}
  - {id: t_arm,           ms: 1000, wire_key: PRD}
  - {id: t_engage_win,    ms: 4000, wire_key: S0O}
  - {id: t_commit_hold,   ms: 500,  wire_key: S0P}
  - {id: t_sample_hold,   ms: 500,  wire_key: S0P}
  - {id: t_resp_win,      ms: 2000, wire_key: S0W}
  - {id: t_resp_hold,     ms: 200,  wire_key: S0H}
  - {id: t_reward_l,      ms: 100}
  - {id: t_reward_r,      ms: 100}
  - {id: t_iti_correct,   ms: 4000}
  - {id: t_pen_error,     ms: 20000}
  - {id: t_pen_break,     ms: 10000}
  - {id: t_pen_noengage,  ms: 6000}
  - {id: t_poll_interval, ms: 5}

contingency:
  stimuli:
    - {id: odor1, emitter: odor_line_1, on_code: ODOR_1_ON}
    - {id: odor3, emitter: odor_line_3, on_code: ODOR_3_ON}

  ports:
    left_well:
      channel: left_well
      enter_code: WATER_POKE_L
      error_code: WATER_POKE_ERROR_L
      break_code: WATER_UNPOKE_EARLY_L
      exit_code: WATER_UNPOKE_L
      reward_line: fluid_0
      reward_duration: t_reward_l
      reward_code: FLUID_L
      reward_stop_code: STOP_FLUID_G_L
    right_well:
      channel: right_well
      enter_code: WATER_POKE_R
      error_code: WATER_POKE_ERROR_R
      break_code: WATER_UNPOKE_EARLY_R
      exit_code: WATER_UNPOKE_R
      reward_line: fluid_2
      reward_duration: t_reward_r
      reward_code: FLUID_R
      reward_stop_code: STOP_FLUID_G_R

  trial_types:
    - {id: go_right, stages: [odor1], target: right_well}
    - {id: go_left,  stages: [odor3], target: left_well}

  context_schedule: []

  outcome_map:
    correct:
      trigger: HELD
      reward: "@target"
      terminal: TRIAL_CORRECT
      delay: t_iti_correct
      strobe: "@target.exit_code"
    wrong:
      trigger: ENTER
      reward: null
      terminal: TRIAL_INCORRECT
      delay: t_pen_error
      strobe: "@ports[$ch].error_code"
    omission:
      trigger: TIMEOUT
      reward: null
      terminal: TRIAL_INCORRECT
      delay: t_pen_error
      strobe: RESP_OMIT
    hold_fail:
      trigger: BROKEN
      reward: null
      terminal: TRIAL_INCORRECT
      delay: t_pen_break
      strobe: "@ports[$ch].break_code"
    no_engage:
      trigger: TIMEOUT
      reward: null
      terminal: TRIAL_INVALID
      delay: t_pen_noengage
      strobe: LAZY_RAT
    hold_break:
      trigger: BROKEN
      reward: null
      terminal: TRIAL_INVALID
      delay: t_pen_break
      strobe: ODOR_UNPOKE_EARLY

policy:
  selection:
    mode: anti_bias
    bias_window: 20
    debias_strength: 0.5
    p_min: 0.02
    p_max: 0.98
    max_run: 10
  correction:
    budgets: {left_well: 0, right_well: 0}
  penalty_escalation:
    applies_to: no_engage
    step_ms: 6000
    ceiling_ms: 30000
    arm_after_stage: 0
    clears_on: TRIAL_CORRECT
  stage_schedule: []
  n_trials: 1000
  seed: host
