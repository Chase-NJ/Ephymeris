# FROM SCRATCH, which is a paradigm that fixes nothing rather than an absence of
# one. The wizard's doctrine is that every value in a generated task is read from
# an existing authority -- the paradigm, the template's capabilities(), the
# channel registry, the strobe vocabulary, or the operator's answer -- and a
# "start from nothing" path would break that by having no paradigm to read.
#
# So this is the smallest thing that compiles, and every knob it sets is one the
# wizard's first structural step immediately offers to change. It is not a
# recommendation about how to run an experiment; it is a floor to stand on.
#
# The one thing it cannot be is EMPTY. A task with no response port has nowhere
# for a trial to end, and a task with no trial type has nothing to present -- so
# `trial_types: one_per_stimulus` with one stimulus is the minimum the compiler
# will accept, and everything past that is the operator's.
paradigm_version: 1
id: blank
name: From scratch
order: 0
# Kept out of the template gallery: this is what a task starts from when the
# operator picks NO template, so listing it would offer the default as one of
# the alternatives to itself.
hidden: true
affords: >-
  One stimulus, one port, reward on a correct poke. The smallest task that
  compiles, and the starting point when none of the shapes below is what you are
  building -- every step after this one changes it.

template: four_epoch
template_version: 2

topology:
  n_sampling_stages: 1
  retention_delay: false
  response_mode: n_alternative
  commit_hold: true
  response_ports: 1

contingency:
  stimuli: 1
  rewarded: true
  trial_types: one_per_stimulus

policy:
  selection:
    mode: weighted_pool
  n_trials: 100

# NO QUESTIONS. A paradigm's questions are the choices its shape leaves open,
# and this shape leaves everything open -- so asking here would be asking twice.
# The wizard's epoch steps are where all of it is answered.
questions: []
