# Shaping -- the full discrimination machine with one arm offered.
#
# WHY EVERY ARM IS BUILT AND ONLY ONE IS OFFERED. A shaping task is not a smaller
# task; it is the real one with the pool collapsed onto a single trial type. Both
# ports stay live and every trial type exists at weight 0, so widening the pool
# later is a policy edit -- one weight -- rather than a reshape that would move
# the spec hash and split the animal's history in Analytics.
paradigm_version: 1
id: shaping
name: Shaping — one side, ramped
order: 30
affords: >-
  The full two-port machine with a single arm offered and a ramp that starts at a
  10 ms hold and walks up to the real task. What the animal learns first is that
  poking produces fluid; the discrimination comes later, by turning up the other
  arms' weights rather than by building a different task.

template: four_epoch
template_version: 2

topology:
  n_sampling_stages: 1
  retention_delay: false
  response_mode: n_alternative
  commit_hold: true
  response_ports: 2

contingency:
  stimuli: 4
  rewarded: true
  trial_types: one_per_stimulus
  weight_one_only: true

policy:
  selection:
    mode: block_shuffled
    block_size: 30
  n_trials: 300
  # The ids a shaping ramp moves. Names only -- the values and the trial
  # boundaries are the operator's, and the wizard asks for them.
  ramped:
    - t_commit_hold
    - t_sample_hold
    - t_resp_hold
    - t_resp_win
    - t_engage_win

questions:
  - id: rewarded_arm
    label: Which arm is offered
    path: contingency.trial_types[0].target
    help: >-
      The port this animal is being shaped toward. Every other trial type is built
      at weight 0, so switching sides later is one weight rather than a new task.
    source: channel
    kind: response
    required: true
  - id: stim_emitter
    label: Stimulus line for the offered arm
    path: contingency.stimuli[0].emitter
    source: channel
    kind: emitter
    required: true
  - id: n_trials
    label: Trials per session
    path: policy.n_trials
