# TG302 — the spec declares an outcome the topology cannot produce.
_expect: TG302
_why: >-
  The other direction: false_alarm only exists on a go/no-go topology. Declared on
  an n-alternative task it is a branch nothing routes to -- harmless at runtime,
  but the author believes the task does something it does not.
_patch:
  contingency.outcome_map.false_alarm:
    trigger: ENTER
    reward: null
    terminal: TRIAL_INCORRECT
    delay: t_pen_error
    strobe: WATER_POKE_NONE
