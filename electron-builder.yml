# The Electron shell's Windows installer and Apple silicon .dmg (ADR 0006,
# `ARCHITECTURE.md#the-electron-shell`). Built by `npm run package:electron`, for
# whichever of the two the build machine is; the version is package.json's, which a CI
# build overrides with `-c.extraMetadata.version=<version>`.

appId: edu.hartlab.ephymeris
productName: Ephymeris
copyright: Hart Lab

directories:
  output: release
  buildResources: build

# The app itself, in app.asar. The webview's libraries are already bundled into
# dist/ by Vite, which is why package.json's `dependencies` holds only what the
# main process loads (electron-updater).
files:
  - package.json
  - dist/**/*
  - dist-electron/**/*
  - "!**/*.map"

# Beside app.asar under resources/, where `electron/launch.ts` finds them through
# `process.resourcesPath`. Staged by scripts/package-resources.mjs.
extraResources:
  - from: build/resources/sidecar
    to: sidecar
  - from: build/resources/arduino
    to: arduino
  - from: build/resources/sketches
    to: sketches
  - from: build/resources/tasksim
    to: tasksim

win:
  target:
    - target: nsis
      arch: [x64]
  icon: electron/icons/icon.ico
  artifactName: "${productName}-${version}-setup.${ext}"

# Per user, no questions. App data
# (`%APPDATA%\edu.hartlab.ephymeris`) is never the installer's to touch.
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Ephymeris
  uninstallDisplayName: Ephymeris
  # Removes a Tauri shell's copy left on the PC before installing (ADR 0006's crossover).
  include: electron/installer.nsh

# Apple silicon, for reading data away from the rigs (`DEVELOPING.md#building-the-installer`).
# Ad-hoc signed (`identity: "-"`): arm64 macOS runs no unsigned code at all, and there is no
# Developer ID to sign or notarize with, so the first launch is allowed by hand in System Settings.
# The hardened runtime stays off because its library validation needs a Team ID, which an
# ad-hoc signature lacks: the frozen sidecar could not load its own libraries.
# A Mac copy never updates itself (`updatesSupported()`); a new .dmg replaces it.
mac:
  target:
    - target: dmg
      arch: [arm64]
  icon: electron/icons/icon.icns
  category: public.app-category.education
  identity: "-"
  hardenedRuntime: false
  artifactName: "${productName}-${version}-arm64.${ext}"

# The update feed (`electron/updater.ts`), baked into every copy as
# resources/app-update.yml. `latest.yml` is written to the `updates` branch by
# publish-update.yml; nothing is ever published from here (`--publish never`).
publish:
  provider: generic
  url: https://raw.githubusercontent.com/Chase-NJ/Ephymeris/updates
  channel: latest

# Every build is a prerelease (1.1.3-alpha.214); keep the feed `latest.yml`
# rather than `alpha.yml`.
detectUpdateChannel: false
