# Two-stimulus sequence with a retention delay.
#
# NOVEL, and the hardest case in the set. It stresses three things simultaneously:
# topology unrolling (n_sampling_stages: 2), per-stage @binding references, and the
# RAM ceiling. If any schema decision makes this awkward, that decision is wrong.
#
# WHAT THIS FILE PROVES:
#
#   1. A sampling CHAIN is a loop bound, not a rewrite. Setting n_sampling_stages
#      to 2 unrolls the sampling band into HOLD -> DELAY(gap) -> HOLD. Nothing in
#      the engagement, response or outcome epochs moves. That containment is the
#      whole reason epochs are separate blocks.
#
#   2. Per-stage bindings work. trial_types[].stages is a LIST, indexed at runtime
#      by $stage, so one node definition serves every stage of every trial type.
#      Without $stage, a 2-stage task would need 2x the nodes and a 3-stage task 3x.
#
#   3. Per-stage timing is independently rampable. t_sample_hold_0 and
#      t_sample_hold_1 are distinct indices, so a schedule can lengthen the second
#      stimulus's hold without touching the first — the thing a working-memory
#      manipulation actually needs.
#
#   4. Order is the discriminandum. AB and BA use the SAME two odors and differ
#      only in sequence, which is what makes this a genuine sequence task rather
#      than a compound-cue task.

spec_version: 1
spec_id: seq2_retention
vocab_version: 1

meta:
  label: Two-odor sequence with retention delay
  description: >-
    Two stimuli presented in sequence with an unfilled gap between them, then an
    unfilled retention delay before the response window opens. A->B goes right,
    B->A goes left.

topology:
  template: four_epoch
  template_version: 2
  n_sampling_stages: 2        # <- unrolls the sampling band; the ONLY structural change
  retention_delay: true       # <- inserts one DELAY before the response window
  response_mode: n_alternative
  response_ports: [left_well, right_well]
  commit_hold: true

timing:
  - {id: t_zero,             ms: 0}
  - {id: t_arm,              ms: 1000}
  - {id: t_engage_win,       ms: 4000}
  - {id: t_commit_hold,      ms: 500}

  # Per-stage sampling. Stage-indexed ids are emitted by the compiler when
  # n_sampling_stages > 1; a 1-stage task keeps the unsuffixed t_sample_hold.
  - {id: t_sample_hold_0,    ms: 400, note: "hold required on the FIRST stimulus"}
  - {id: t_interstim_gap_0,  ms: 500, note: "unfilled gap; engagement still required. Set to 0 for a compound simultaneous cue."}
  - {id: t_sample_hold_1,    ms: 400, note: "hold on the SECOND stimulus — independently rampable"}

  - {id: t_retention,        ms: 1500, note: "unfilled delay between sampling and responding — the working-memory load"}

  - {id: t_resp_win,         ms: 2000}
  - {id: t_resp_hold,        ms: 200}
  - {id: t_reward_l,         ms: 100}
  - {id: t_reward_r,         ms: 100}
  - {id: t_iti_correct,      ms: 4000}
  - {id: t_pen_error,        ms: 20000}
  - {id: t_pen_break,        ms: 10000}
  - {id: t_pen_noengage,     ms: 6000}
  - {id: t_poll_interval,    ms: 5}

contingency:
  stimuli:
    - {id: odor_a, emitter: odor_line_1, on_code: ODOR_1_ON}
    - {id: odor_b, emitter: odor_line_3, on_code: ODOR_3_ON}

  ports:
    left_well:
      channel: left_well
      enter_code: WATER_POKE_L
      error_code: WATER_POKE_ERROR_L
      break_code: WATER_UNPOKE_EARLY_L
      exit_code: WATER_UNPOKE_L
      reward_line: fluid_0
      reward_duration: t_reward_l
      reward_code: FLUID_L
      reward_stop_code: STOP_FLUID_G_L
    right_well:
      channel: right_well
      enter_code: WATER_POKE_R
      error_code: WATER_POKE_ERROR_R
      break_code: WATER_UNPOKE_EARLY_R
      exit_code: WATER_UNPOKE_R
      reward_line: fluid_2
      reward_duration: t_reward_r
      reward_code: FLUID_R
      reward_stop_code: STOP_FLUID_G_R

  # stages[] length MUST equal topology.n_sampling_stages — the linter checks it.
  # Same two odors in both rows; only the ORDER differs.
  trial_types:
    - {id: seq_ab, stages: [odor_a, odor_b], target: right_well}
    - {id: seq_ba, stages: [odor_b, odor_a], target: left_well}

  context_schedule: []

  outcome_map:
    correct:
      trigger: HELD
      reward: "@target"
      terminal: TRIAL_CORRECT
      delay: t_iti_correct
      strobe: "@target.exit_code"
    wrong:
      trigger: ENTER
      reward: null
      terminal: TRIAL_INCORRECT
      delay: t_pen_error
      strobe: "@ports[$ch].error_code"

    omission:
      trigger: TIMEOUT
      reward: null
      terminal: TRIAL_INCORRECT
      delay: t_pen_error
      strobe: RESP_OMIT
      note: >-
        A NEW task, so it uses the new code rather than reproducing firmware's
        silence. grgl_2odor must keep `strobe: null` here for bit-identity, but
        nothing constrains a task with no equivalence target — and an omission after
        a full two-stimulus sequence is exactly the event worth being able to find in
        the stream. This is the concrete payoff of the append-only rule: the two
        tasks disagree without either being wrong. See docs/decisions.md D4.

    hold_fail:
      trigger: BROKEN
      reward: null
      terminal: TRIAL_INCORRECT
      delay: t_pen_break
      strobe: "@ports[$ch].break_code"
    no_engage:
      trigger: TIMEOUT
      reward: null
      terminal: TRIAL_INVALID
      delay: t_pen_noengage
      strobe: LAZY_RAT

    hold_break:
      trigger: BROKEN
      reward: null
      terminal: TRIAL_INVALID
      delay: t_pen_break
      strobe: ODOR_UNPOKE_EARLY
      note: >-
        Reached from FOUR sites here (commit hold, stage-0 hold, the gap, stage-1
        hold) versus two in GRGL, all sharing one code. Which stage the animal broke
        at is recoverable from the PRECEDING strobe — ODOR_1_ON vs INTERSTIM_GAP_ON
        vs ODOR_3_ON — which only works because every one of those is a state-entry
        code. This is the invariant paying for itself.

policy:
  selection:
    mode: anti_bias
    bias_window: 20
    debias_strength: 0.5
    p_min: 0.02
    p_max: 0.98
    max_run: 10

  # A working-memory ramp: lengthen the retention delay as the animal improves,
  # touching ONE timing entry. The sampling holds stay put.
  stage_schedule:
    - {at_trial: 0,   set: {t_retention: 250}}
    - {at_trial: 60,  set: {t_retention: 500}}
    - {at_trial: 150, set: {t_retention: 1000}}
    - {at_trial: 300, set: {t_retention: 1500}}

  n_trials: 800
  seed: host
